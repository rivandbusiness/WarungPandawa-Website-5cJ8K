<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Pandawa | Makanan, Cemilan & Minuman Lezat</title>
    <meta name="description" content="Warung Pandawa menyediakan berbagai makanan, cemilan, dan minuman dengan cita rasa khas nusantara.">
    <!-- Logo Favicon Google -->
    <link rel="icon" href="https://i.ibb.co.com/cctXZ50b/20260630-152435.png" type="image/png">
    <link rel="shortcut icon" href="https://i.ibb.co.com/cctXZ50b/20260630-152435.png" type="image/png">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/cctXZ50b/20260630-152435.png">
    <meta name="theme-color" content="#ff8c00">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        :root { --primary: #ff6b35; --secondary: #004e64; --bg: #f8fafc; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: #1e293b; padding-bottom: 90px; }
        .container { max-width: 600px; margin: auto; }
        
        /* Top Navigation Header & Hamburger */
        .top-navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #ffffff; padding: 10px 16px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .brand-logo { font-weight: bold; font-size: 16px; color: var(--secondary); display: flex; align-items: center; gap: 8px; }
        .hamburger-btn { background: #f1f5f9; border: none; font-size: 18px; color: var(--secondary); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Slide Drawer Menu (Garis Tiga) */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .drawer-overlay.active { opacity: 1; visibility: visible; }
        .drawer-content { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #ffffff; z-index: 1001; transition: 0.3s ease-in-out; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .drawer-content.active { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 15px; }

        /* User Card Inside Drawer */
        .user-box { text-align: center; background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); margin: 0 auto 8px auto; display: none; }
        
        .drawer-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 600; color: #334155; cursor: pointer; text-align: left; margin-bottom: 5px; }
        .drawer-item:hover { background: #f1f5f9; }

        .header { background: linear-gradient(135deg, #004e64, #2575fc); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 22px; }

        /* Filter Kategori */
        .category-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { background: white; border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Grid Cards Menu */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .menu-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .menu-img { width: 85px; height: 85px; border-radius: 10px; object-fit: cover; background: #f1f5f9; flex-shrink: 0; }
        .menu-info { flex: 1; }
        .menu-title { font-weight: bold; font-size: 15px; margin-bottom: 3px; color: var(--secondary); }
        .menu-desc { font-size: 11px; color: #64748b; margin-bottom: 6px; line-height: 1.3; }
        .menu-price { font-size: 14px; font-weight: bold; color: var(--primary); }
        .menu-stock { font-size: 11px; color: #64748b; }

        /* Counter Input */
        .counter-box { display: flex; align-items: center; gap: 8px; }
        .btn-qty { background: #f1f5f9; border: none; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--secondary); }
        .btn-qty:disabled { opacity: 0.4; cursor: not-allowed; }
        .qty-val { font-weight: bold; font-size: 14px; width: 16px; text-align: center; }

        /* Floating Cart Bar */
        .cart-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 580px; background: var(--secondary); color: white; padding: 12px 20px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 99; }
        .btn-checkout { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Navbar Ringkas dengan Garis Tiga -->
    <div class="top-navbar">
        <div class="brand-logo"><i class="fa-solid fa-utensils" style="color:var(--primary);"></i> RivandCronz</div>
        <button class="hamburger-btn" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- Header Banner Store -->
    <div class="header">
        <h1>Daftar Menu</h1>
        <p style="margin: 5px 0 0 0; font-size: 12px; opacity: 0.9;">Pilih menu favoritmu & pesan langsung!</p>
    </div>

    <!-- Filter Kategori -->
    <div class="category-container">
        <button class="cat-btn active" onclick="filterKategori('semua', this)">✨ Semua</button>
        <button class="cat-btn" onclick="filterKategori('makanan', this)">🍲 Makanan</button>
        <button class="cat-btn" onclick="filterKategori('minuman', this)">🥤 Minuman</button>
        <button class="cat-btn" onclick="filterKategori('cemilan', this)">🍿 Cemilan</button>
        <button class="cat-btn" onclick="filterKategori('promo', this)">🔥 Promo</button>
    </div>

    <!-- Daftar Menu -->
    <div id="user-menu-list" class="menu-grid">
        <p style="text-align: center; color: #94a3b8; padding: 30px;">Memuat menu...</p>
    </div>
</div>

<!-- Floating Cart Bar -->
<div class="cart-bar">
    <div>
        <span style="font-size: 11px; opacity: 0.8; display: block;">Total Pesanan:</span>
        <strong id="cart-total" style="font-size: 16px; color: #ffc107;">Rp 0</strong>
    </div>
    <button class="btn-checkout" onclick="prosesPesanan()"><i class="fa-solid fa-cart-shopping"></i> Pesan Sekarang</button>
</div>

<!-- Slide Drawer Menu (Garis Tiga) -->
<div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
<div id="drawer-content" class="drawer-content">
    <div class="drawer-header">
        <strong style="color:var(--secondary); font-size:15px;"><i class="fa-solid fa-user-circle"></i> Akun Saya</strong>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:18px;" onclick="toggleDrawer()"></i>
    </div>

    <div class="user-box">
        <img id="drawer-user-img" class="user-avatar" src="">
        <div id="drawer-user-name" style="font-weight:bold; font-size:14px; color:#1e293b;">Tamu</div>
        <div id="drawer-user-email" style="font-size:11px; color:#64748b;">Belum Masuk</div>
    </div>

    <div id="drawer-actions">
        <!-- Opsi Tombol berubah sesuai status Auth -->
    </div>
</div>

<script>
    // Config Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAIcVk11dLwbwhHPmV--qfYmHrQuaHhXbw",
        authDomain: "warung-pandawa-89cb5.firebaseapp.com",
        projectId: "warung-pandawa-89cb5",
        storageBucket: "warung-pandawa-89cb5.firebasestorage.app",
        messagingSenderId: "789317550948",
        appId: "1:789317550948:web:b1c635d5728e3ffb13f071",
        measurementId: "G-Y455NCGBGK",
        databaseURL: "https://warung-pandawa-89cb5-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const database = firebase.database();
    const auth = firebase.auth();

    let semuaMenuData = {};
    let keranjang = {}; 
    let kategoriAktif = 'semua';
    let currentUserData = null;

    // Toggle Open/Close Drawer Garis Tiga
    function toggleDrawer() {
        document.getElementById('drawer-overlay').classList.toggle('active');
        document.getElementById('drawer-content').classList.toggle('active');
    }

    // Monitor Status Auth Google
    auth.onAuthStateChanged((user) => {
        const actionBox = document.getElementById('drawer-actions');
        if (user) {
            document.getElementById('drawer-user-img').src = user.photoURL || 'https://via.placeholder.com/60';
            document.getElementById('drawer-user-img').style.display = 'block';
            document.getElementById('drawer-user-name').innerText = user.displayName;
            document.getElementById('drawer-user-email').innerText = user.email;

            actionBox.innerHTML = `
                <button class="drawer-item" onclick="toggleDrawer(); bukaModalProfil();">
                    <i class="fa-solid fa-address-card" style="color:var(--primary);"></i> Edit Biodata Pelanggan
                </button>
                <button class="drawer-item" style="color:#ef4444;" onclick="logoutGoogle()">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar (Logout)
                </button>
            `;

            database.ref('users/' + user.uid).on('value', (snap) => {
                currentUserData = snap.val() || { nama: user.displayName, email: user.email, hp: '', alamat: '' };
            });
        } else {
            currentUserData = null;
            document.getElementById('drawer-user-img').style.display = 'none';
            document.getElementById('drawer-user-name').innerText = 'Tamu';
            document.getElementById('drawer-user-email').innerText = 'Silakan masuk untuk auto-fill data';

            actionBox.innerHTML = `
                <button class="drawer-item" onclick="loginGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16"> Masuk dengan Google
                </button>
            `;
        }
    });

    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then((res) => {
            database.ref('users/' + res.user.uid).update({
                nama: res.user.displayName,
                email: res.user.email,
                photo: res.user.photoURL,
                lastLogin: Date.now()
            });
            toggleDrawer();
            Swal.fire({ icon: 'success', title: 'Berhasil Masuk!', timer: 1200, showConfirmButton: false });
        }).catch((err) => { Swal.fire('Gagal Login', err.message, 'error'); });
    }

    function logoutGoogle() {
        auth.signOut().then(() => {
            toggleDrawer();
            Swal.fire({ icon: 'info', title: 'Berhasil Keluar', timer: 1200, showConfirmButton: false });
        });
    }

    function bukaModalProfil() {
        const user = auth.currentUser;
        if (!user) return;

        Swal.fire({
            title: 'Biodata Pelanggan',
            html: `
                <style>
                    .prof-box { text-align: left; font-size: 13px; }
                    .prof-field { margin-bottom: 10px; }
                    .prof-field label { display: block; font-weight: 600; font-size: 12px; color: #4a5568; margin-bottom: 4px; }
                    .prof-input { width: 100% !important; margin: 0 !important; box-sizing: border-box !important; padding: 8px 10px !important; border: 1.5px solid #cbd5e1 !important; border-radius: 8px !important; }
                </style>
                <div class="prof-box">
                    <div class="prof-field">
                        <label>Nama Lengkap:</label>
                        <input id="prof-nama" class="prof-input" value="${currentUserData?.nama || user.displayName}">
                    </div>
                    <div class="prof-field">
                        <label>No. WhatsApp / HP (Penting):</label>
                        <input id="prof-hp" type="number" class="prof-input" value="${currentUserData?.hp || ''}" placeholder="08xxxxxxxxxx">
                    </div>
                    <div class="prof-field">
                        <label>Alamat Utama (Auto-fill saat delivery):</label>
                        <textarea id="prof-alamat" class="prof-input" rows="2" placeholder="Nama Jalan, Blok, No. Rumah...">${currentUserData?.alamat || ''}</textarea>
                    </div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'Simpan Biodata',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#ff6b35',
            preConfirm: () => {
                return {
                    nama: document.getElementById('prof-nama').value.trim(),
                    hp: document.getElementById('prof-hp').value.trim(),
                    alamat: document.getElementById('prof-alamat').value.trim()
                };
            }
        }).then((res) => {
            if (res.isConfirmed) {
                database.ref('users/' + user.uid).update(res.value).then(() => {
                    Swal.fire({ icon: 'success', title: 'Biodata Disimpan!', timer: 1300, showConfirmButton: false });
                });
            }
        });
    }

    // Load Realtime Menu Database
    database.ref('daftar_menu').on('value', (snapshot) => {
        semuaMenuData = snapshot.val() || {};
        renderMenu();
    });

    function renderMenu() {
        const menuBox = document.getElementById('user-menu-list');
        menuBox.innerHTML = "";

        let keys = Object.keys(semuaMenuData);
        if (keys.length === 0) {
            menuBox.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:30px;">Belum ada menu tersedia.</p>`;
            return;
        }

        keys.forEach(key => {
            let item = semuaMenuData[key];
            if (kategoriAktif !== 'semua' && item.kategori !== kategoriAktif) return;

            let qty = keranjang[item.id] ? keranjang[item.id].qty : 0;
            let stokHabis = (item.stok || 0) <= 0;

            menuBox.innerHTML += `
                <div class="menu-card" style="${stokHabis ? 'opacity: 0.6;' : ''}">
                    <img src="${item.gambar || 'https://via.placeholder.com/150'}" class="menu-img" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                    <div class="menu-info">
                        <div class="menu-title">${item.nama}</div>
                        <div class="menu-desc">${item.deskripsi || 'Tidak ada deskripsi.'}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                            <div>
                                <div class="menu-price">Rp ${item.harga.toLocaleString('id-ID')}</div>
                                <div class="menu-stock">${stokHabis ? '<span style="color:red; font-weight:bold;">Stok Habis</span>' : 'Stok: ' + item.stok}</div>
                            </div>
                            
                            <div class="counter-box">
                                <button class="btn-qty" onclick="ubahQty('${item.id}', -1)" ${qty === 0 ? 'disabled' : ''}>-</button>
                                <span class="qty-val">${qty}</span>
                                <button class="btn-qty" onclick="ubahQty('${item.id}', 1)" ${stokHabis || qty >= item.stok ? 'disabled' : ''}>+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function ubahQty(id, delta) {
        let item = semuaMenuData[id];
        if (!item) return;

        if (!keranjang[id]) {
            keranjang[id] = { nama: item.nama, harga: item.harga, qty: 0 };
        }

        keranjang[id].qty += delta;

        if (keranjang[id].qty <= 0) {
            delete keranjang[id];
        }

        updateTotalKeranjang();
        renderMenu();
    }

    function updateTotalKeranjang() {
        let total = 0;
        Object.keys(keranjang).forEach(id => {
            total += keranjang[id].harga * keranjang[id].qty;
        });
        document.getElementById('cart-total').innerText = "Rp " + total.toLocaleString('id-ID');
    }

    function filterKategori(kat, btn) {
        kategoriAktif = kat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMenu();
    }

    // Checkout Modal dengan Auto-fill dari Biodata Pelanggan
    function prosesPesanan() {
        let rincianItemHtml = "";
        let itemsArray = [];
        let totalHarga = 0;

        Object.keys(keranjang).forEach(id => {
            let item = keranjang[id];
            let subtotal = item.harga * item.qty;
            totalHarga += subtotal;
            itemsArray.push(`${item.nama} (${item.qty}x)`);

            rincianItemHtml += `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #e2e8f0; padding: 6px 0; font-size:13px;">
                    <div>
                        <span style="font-weight:600; color:#1e293b;">${item.nama}</span>
                        <div style="font-size:11px; color:#64748b;">${item.qty} x Rp ${item.harga.toLocaleString('id-ID')}</div>
                    </div>
                    <span style="font-weight:bold; color:var(--primary);">Rp ${subtotal.toLocaleString('id-ID')}</span>
                </div>
            `;
        });

        if (itemsArray.length === 0) {
            Swal.fire('Keranjang Kosong', 'Pilih minimal 1 menu sebelum memesan!', 'warning');
            return;
        }

        Swal.fire({
            title: '<span style="font-size:18px; color:var(--secondary);"><i class="fa-solid fa-receipt"></i> Rincian & Checkout</span>',
            html: `
                <style>
                    .checkout-box { text-align: left; font-size: 13px; color: #334155; }
                    .checkout-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
                    .checkout-field { margin-bottom: 10px; }
                    .checkout-field label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; color: #4a5568; }
                    .checkout-input { 
                        width: 100% !important; margin: 0 !important; box-sizing: border-box !important;
                        padding: 9px 12px !important; border: 1.5px solid #cbd5e1 !important; 
                        border-radius: 8px !important; font-size: 13px !important; height: auto !important;
                    }
                </style>
                
                <div class="checkout-box">
                    <div class="checkout-section">
                        <div style="font-size:12px; font-weight:bold; color:#64748b; margin-bottom:5px; text-transform:uppercase;">Ringkasan Pesanan:</div>
                        <div style="max-height: 120px; overflow-y: auto;">${rincianItemHtml}</div>
                        <div style="display:flex; justify-content:space-between; margin-top:8px; font-weight:bold; font-size:14px;">
                            <span>Total Bayar:</span>
                            <span style="color:var(--primary);">Rp ${totalHarga.toLocaleString('id-ID')}</span>
                        </div>
                    </div>

                    <div class="checkout-field">
                        <label><i class="fa-solid fa-user"></i> Nama Lengkap / Meja:</label>
                        <input id="order-nama" class="checkout-input" value="${currentUserData?.nama || ''}" placeholder="Masukkan nama kamu...">
                    </div>

                    <div class="checkout-field">
                        <label><i class="fa-brands fa-whatsapp"></i> No. WhatsApp / HP:</label>
                        <input id="order-hp" type="number" class="checkout-input" value="${currentUserData?.hp || ''}" placeholder="08xxxxxxxxxx">
                    </div>

                    <div class="checkout-field">
                        <label><i class="fa-solid fa-location-dot"></i> Opsi / Alamat Pengiriman:</label>
                        <select id="order-tipe" class="checkout-input" onchange="toggleAlamatField(this.value)">
                            <option value="Dine In (Makan di Tempat)">🍽️ Makan di Tempat (Dine In)</option>
                            <option value="Takeaway (Bungkus)">🛍️ Bungkus (Takeaway)</option>
                            <option value="Delivery (Kirim Alamat)">🛵 Antar Alamat (Delivery)</option>
                        </select>
                    </div>

                    <div class="checkout-field" id="box-alamat" style="display:none;">
                        <label>Alamat Lengkap Pengiriman:</label>
                        <textarea id="order-alamat" class="checkout-input" rows="2" placeholder="Jalan, No. Rumah, Patokan...">${currentUserData?.alamat || ''}</textarea>
                    </div>

                    <div class="checkout-field">
                        <label><i class="fa-solid fa-wallet"></i> Metode Pembayaran:</label>
                        <select id="order-metode" class="checkout-input">
                            <option value="Cash / Tunai">💵 Cash / Tunai</option>
                            <option value="QRIS / All Payment">📱 QRIS (Gopay/OVO/Dana/LinkAja)</option>
                            <option value="Transfer Bank BCA">🏦 Transfer Bank BCA</option>
                            <option value="Transfer Bank Mandiri">🏦 Transfer Bank Mandiri</option>
                        </select>
                    </div>

                    <div class="checkout-field">
                        <label><i class="fa-solid fa-note-sticky"></i> Catatan Khusus (Opsional):</label>
                        <input id="order-catatan" class="checkout-input" placeholder="Contoh: Jangan pedas, es dipisah...">
                    </div>
                </div>
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: '<i class="fa-solid fa-paper-plane"></i> Buat Pesanan',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#ff6b35',
            didOpen: () => {
                window.toggleAlamatField = function(val) {
                    const boxAlamat = document.getElementById('box-alamat');
                    if(val.includes('Delivery')) {
                        boxAlamat.style.display = 'block';
                    } else {
                        boxAlamat.style.display = 'none';
                    }
                };
            },
            preConfirm: () => {
                const nama = document.getElementById('order-nama').value.trim();
                const hp = document.getElementById('order-hp').value.trim();
                const tipe = document.getElementById('order-tipe').value;
                const alamat = document.getElementById('order-alamat').value.trim();
                const metode = document.getElementById('order-metode').value;
                const catatan = document.getElementById('order-catatan').value.trim();

                if (!nama) {
                    Swal.showValidationMessage('Nama / Nomor Meja wajib diisi!');
                    return false;
                }
                if (tipe.includes('Delivery') && !alamat) {
                    Swal.showValidationMessage('Alamat pengiriman wajib diisi untuk layanan Delivery!');
                    return false;
                }

                return { nama, hp, tipe, alamat, metode, catatan };
            }
        }).then((result) => {
            if (result.isConfirmed) {
                let dataForm = result.value;
                let orderId = "ORD-" + Date.now();
                
                database.ref('pesanan/' + orderId).set({
                    id: orderId,
                    userId: auth.currentUser ? auth.currentUser.uid : 'tamu',
                    nama: dataForm.nama,
                    hp: dataForm.hp || '-',
                    tipe: dataForm.tipe,
                    alamat: dataForm.alamat || '-',
                    items: itemsArray,
                    total: totalHarga,
                    metode: dataForm.metode,
                    catatan: dataForm.catatan || '-',
                    pembayaran: 'Belum Bayar',
                    status: 'Menunggu Respon',
                    timestamp: Date.now()
                }).then(() => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Pesanan Diterima!',
                        text: 'Terima kasih, pesananmu sedang diteruskan ke dapur RivandCronz.',
                        confirmButtonColor: '#ff6b35'
                    });
                    keranjang = {};
                    updateTotalKeranjang();
                    renderMenu();
                });
            }
        });
    }
</script>
</body>
</html>
